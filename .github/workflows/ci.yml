name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - name: Shell scripts
        run: shellcheck --severity=warning install.sh docs/demo.sh tests/run.sh hooks/scripts/*.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hooks, installer and file formats
        run: bash tests/run.sh
      - name: Demo (the Stop hook on three made-up transcripts)
        run: ./docs/demo.sh

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Relative links and #anchors must resolve: these are ours, so they fail the build.
      - name: Relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          jobSummary: false
      # Other sites go down and rate-limit runners: retry, accept the bot-wall codes, report
      # what's still broken in the job summary, but don't fail the build on someone else's outage.
      - name: External links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 4 --retry-wait-time 5 --timeout 30 --accept '200..=299,403,429,999' './**/*.md'
          fail: false
